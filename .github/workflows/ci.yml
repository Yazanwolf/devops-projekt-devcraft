name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          docker: true
          
      - run: npm ci

      - name: Build Docker Image
        run: docker build -t notes-api .

      - name: Start database
        run: docker compose up -d --wait db
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

      - name: Run Prisma migration
        run: npx prisma migrate deploy
        env:
          DB_URL: postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@localhost:5432/notes

      - name: Run tests
        run: npm test
        env:
          DB_URL: postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@localhost:5432/notes

      - name: Start application
        run: docker compose up -d --build app
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

      - name: Check application health
        run: curl --fail --retry 10 --retry-connrefused --retry-delay 2 http://localhost:3000/health