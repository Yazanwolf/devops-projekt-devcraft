services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: notes
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d notes"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: notes-api
    ports:
      - "3000:3000"
    environment:
      DB_URL: "postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/notes"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

volumes:
  postgres-data: