services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: notes
  app:
    build: .
    container_name: notes-api
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DB_URL}
    depends_on:
      - db

volumes:
  postgres-data: