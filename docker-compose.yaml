services:
  db:
    image: postgres:16
    volumes:
      - data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: notes
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notes-api
    restart: unless-stopped
    image: docker-backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DB_URL}

volumes:
  data: